name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gantree-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Same as ci.yml: `tools` is gone from Google's repository (setup-android#537).
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Sideload-from-GitHub is the product. Play Store is not a goal.
      # A stable keystore is optional (one SHA-1 for Google Sign-In).
      # Without it the APK is debug-signed and still installs.
      # A missing keystore or secret must not fail the tag.
      - name: Optional stable keystore
        env:
          CAB_KEYSTORE_BASE64: ${{ secrets.CAB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${CAB_KEYSTORE_BASE64}" ]]; then
            echo "$CAB_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/gantree-android.jks"
            echo "CAB_STORE_FILE=${RUNNER_TEMP}/gantree-android.jks" >> "$GITHUB_ENV"
          fi

      # Gradle defaults mailbox to the emulator loopback and leaves Google Sign-In
      # blank — fine for debug, not for a sideload release APK.
      - name: Require baked mailbox config
        env:
          CAB_MAILBOX_ORIGIN: ${{ secrets.CAB_MAILBOX_ORIGIN || vars.CAB_MAILBOX_ORIGIN }}
          CAB_GOOGLE_WEB_CLIENT_ID: ${{ secrets.CAB_GOOGLE_WEB_CLIENT_ID || vars.CAB_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CAB_MAILBOX_ORIGIN}" ]]; then
            echo "::error::CAB_MAILBOX_ORIGIN is required for release APKs (Actions secret or variable)."
            exit 1
          fi
          if [[ -z "${CAB_GOOGLE_WEB_CLIENT_ID}" ]]; then
            echo "::error::CAB_GOOGLE_WEB_CLIENT_ID is required for release APKs (Actions secret or variable)."
            exit 1
          fi

      - name: Assemble release APK
        env:
          CAB_STORE_PASSWORD: ${{ secrets.CAB_STORE_PASSWORD }}
          CAB_KEY_ALIAS: ${{ secrets.CAB_KEY_ALIAS }}
          CAB_KEY_PASSWORD: ${{ secrets.CAB_KEY_PASSWORD }}
          CAB_MAILBOX_ORIGIN: ${{ secrets.CAB_MAILBOX_ORIGIN || vars.CAB_MAILBOX_ORIGIN }}
          CAB_GOOGLE_WEB_CLIENT_ID: ${{ secrets.CAB_GOOGLE_WEB_CLIENT_ID || vars.CAB_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        run: |
          set -euo pipefail
          name="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/VERSION")"
          name="${name#v}"
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$src"
          mkdir -p dist
          cp "$src" "dist/gantree-android-${name}.apk"
          echo "APK=${GITHUB_WORKSPACE}/gantree-android/dist/gantree-android-${name}.apk" >> "$GITHUB_ENV"
          echo "APK_NAME=gantree-android-${name}" >> "$GITHUB_ENV"

      - name: Signing cert SHA-1
        run: |
          set -euo pipefail
          sha_file="dist/${APK_NAME}-sha1.txt"
          ./scripts/apk-sha1.sh "$APK" "$sha_file"
          if [[ -n "${CAB_STORE_FILE:-}" ]]; then
            kind=stable
          else
            kind=ephemeral
          fi
          ./scripts/apk-sha1.sh --notes "$(cat "$sha_file")" "$kind" > dist/release-notes-sha1.md

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          if-no-files-found: error
          path: |
            gantree-android/dist/*.apk
            gantree-android/dist/*-sha1.txt
            gantree-android/dist/release-notes-sha1.md

  ios:
    name: iOS archive
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Missing signing must not fail the tag. The zip step runs only
      # when the archive exists.
      - name: Unsigned archive
        id: archive
        continue-on-error: true
        env:
          HELM_MAILBOX_ORIGIN: ${{ secrets.HELM_MAILBOX_ORIGIN || vars.HELM_MAILBOX_ORIGIN }}
          HELM_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HELM_GOOGLE_WEB_CLIENT_ID || vars.HELM_GOOGLE_WEB_CLIENT_ID }}
          HELM_GOOGLE_IOS_CLIENT_ID: ${{ secrets.HELM_GOOGLE_IOS_CLIENT_ID || vars.HELM_GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          reversed=""
          suffix=".apps.googleusercontent.com"
          ios_id="${HELM_GOOGLE_IOS_CLIENT_ID:-}"
          if [[ -n "$ios_id" && "$ios_id" == *"$suffix" ]]; then
            reversed="com.googleusercontent.apps.${ios_id%"$suffix"}"
          fi
          xcodebuild \
            -project gantree-ios/app/Helm.xcodeproj \
            -scheme Helm \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            "HELM_MAILBOX_ORIGIN=${HELM_MAILBOX_ORIGIN:-}" \
            "HELM_GOOGLE_WEB_CLIENT_ID=${HELM_GOOGLE_WEB_CLIENT_ID:-}" \
            "HELM_GOOGLE_IOS_CLIENT_ID=${ios_id}" \
            "HELM_GOOGLE_REVERSED_CLIENT_ID=${reversed}" \
            archive \
            -archivePath "$RUNNER_TEMP/gantree-ios.xcarchive"

      - name: Zip unsigned archive
        if: steps.archive.outcome == 'success'
        run: |
          set -euo pipefail
          name="$(tr -d '[:space:]' < VERSION)"
          name="${name#v}"
          mkdir -p dist
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/gantree-ios.xcarchive" \
            "dist/gantree-ios-${name}-unsigned.xcarchive.zip"

      - name: Upload archive
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release
          if-no-files-found: ignore
          path: dist/gantree-ios-*-unsigned.xcarchive.zip

  release:
    name: GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: android-release
          path: dist/android

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ios-release
          path: dist/ios

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          assets=()
          while IFS= read -r -d '' f; do
            assets+=("$f")
          done < <(find dist -type f \( -name '*.apk' -o -name '*-sha1.txt' -o -name '*.xcarchive.zip' \) -print0)

          notes="$(mktemp)"
          {
            sha_notes="$(find dist -name 'release-notes-sha1.md' -type f | head -n1 || true)"
            if [[ -n "${sha_notes}" ]]; then
              cat "$sha_notes"
              echo
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              --jq .body || true
          } > "$notes"

          prerelease=0
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — updating"
            if ((${#assets[@]})); then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            fi
            if [[ "$prerelease" -eq 1 ]]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" --latest
            fi
            exit 0
          fi

          extra=()
          if [[ "$prerelease" -eq 1 ]]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          if ((${#assets[@]})); then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --notes-file "$notes" "${extra[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --notes-file "$notes" "${extra[@]}"
          fi

      - name: Point latest git tag at this release
        # Keep a floating `latest` tag on the same commit as the version tag (v*).
        # Skip prereleases (semver with a hyphen, e.g. v1.2.3-rc.1).
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -fa latest -m "Release ${GITHUB_REF_NAME} (latest)"
          git push --force origin refs/tags/latest
